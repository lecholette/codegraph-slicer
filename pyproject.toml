[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraph-slicer"
version = "0.3.8"
description = "Static Python, Java, TypeScript/TSX, and JavaScript/JSX code graph: repo maps, symbol slices, local flow slices, task routing, and base-vs-head deltas"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.24",
    "tree-sitter-java>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-language-pack>=0.7",
]
authors = [{name = "Chris Cholette"}]
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
codegraph-slicer = "codegraph_slicer.cli:main"

[project.urls]
Homepage = "https://github.com/lecholette/codegraph-slicer"

[tool.setuptools]
packages = ["codegraph_slicer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
